name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build Android Project
      run: |
        echo "Searching for the directory containing settings.gradle..."
        PROJECT_ROOT=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_ROOT" ]; then
          echo "ERROR: settings.gradle could not be found anywhere in the uploaded files."
          exit 1
        fi
        
        echo "Found project root folder at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        if [ ! -f gradlew ]; then
          echo "Generating missing build wrapper..."
          gradle wrapper
        fi
        
        echo "Granting execution permissions..."
        chmod +x gradlew
        
        echo "Compiling Android App..."
        ./gradlew assembleDebug
        
        # Save the location of the compiled APK for the next step
        APK_PATH=$(find . -name "*.apk" -path "*/outputs/apk/*" | head -n 1)
        echo "APK_LOCATION=$PROJECT_ROOT/$APK_PATH" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.APK_LOCATION }}
        
