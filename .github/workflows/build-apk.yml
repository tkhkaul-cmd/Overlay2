name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build Android Project
      run: |
        echo "=== Current Repository Structure ==="
        find . -maxdepth 3 -not -path '*/.*'
        echo "===================================="

        echo "Searching for directory containing configuration files..."
        # Search for either settings.gradle or settings.gradle.kts
        CONFIG_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
        
        if [ -z "$CONFIG_FILE" ]; then
          echo "ERROR: Neither settings.gradle nor settings.gradle.kts could be found."
          exit 1
        fi
        
        PROJECT_ROOT=$(dirname "$CONFIG_FILE")
        echo "Found project root folder at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        if [ ! -f gradlew ]; then
          echo "Generating missing build wrapper..."
          gradle wrapper
        fi
        
        echo "Granting execution permissions..."
        chmod +x gradlew
        
        echo "Compiling Android App..."
        ./gradlew assembleDebug
        
        # Locate the compiled APK file safely
        APK_RELATIVE_PATH=$(find . -name "*.apk" -path "*/outputs/apk/*" | head -n 1)
        echo "APK_LOCATION=$PROJECT_ROOT/$APK_RELATIVE_PATH" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.APK_LOCATION }}
        
