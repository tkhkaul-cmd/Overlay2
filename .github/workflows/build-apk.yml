name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restructure Mobile Upload to Standard Android Layout
      run: |
        echo "Cleaning up duplicate gradle copies..."
        rm -f "build.gradle (1).kts"

        echo "Creating standard Android directory structures..."
        mkdir -p app/src/main/java/com/example/overlay
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        echo "Moving code files into correct package pathways..."
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/overlay/
        [ -f FloatingOverlayService.kt ] && mv FloatingOverlayService.kt app/src/main/java/com/example/overlay/
        [ -f MacroAccessibilityService.kt ] && mv MacroAccessibilityService.kt app/src/main/java/com/example/overlay/

        echo "Moving resource and layout files..."
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
        [ -f layout_floating_overlay.xml ] && mv layout_floating_overlay.xml app/src/main/res/layout/
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        [ -f accessibility_service_config.xml ] && mv accessibility_service_config.xml app/src/main/res/xml/

        echo "Organizing root configuration blueprints..."
        if [ -f build.gradle.kts ]; then
          mv build.gradle.kts app/build.gradle.kts
        fi

        echo "Creating base root fallback build file..."
        cat << 'EOF' > build.gradle.kts
        // Root build file
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        echo "Regenerating fresh local project runner wrapper..."
        gradle wrapper

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
